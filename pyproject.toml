[build-system]
# setup.py compiles the GPU runtime library with CMake and Ninja (see there).
requires = ["setuptools>=68", "cmake>=3.24", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "h3metal"
version = "0.6.4"
description = "FLUX.2 [klein] 4B and 9B, Z-Image-Turbo and MiniMax-H3-Image on Apple Silicon, with LoRA adapters and its own Metal engine for the GPU neural accelerators."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "h3metal contributors" }]
requires-python = ">=3.10"
keywords = ["apple-silicon", "metal", "diffusion", "text-to-image", "image-editing", "lora", "minimax-h3-image", "z-image-turbo", "flux2", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: GPU",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy", "tokenizers", "pillow"]

[project.urls]
Homepage = "https://github.com/audenvenn/h3metal"
Issues = "https://github.com/audenvenn/h3metal/issues"
Changelog = "https://github.com/audenvenn/h3metal/blob/main/CHANGELOG.md"

[project.scripts]
h3metal = "h3metal.cli:main"

[tool.setuptools]
packages = ["h3metal"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Long lines, one-line compound statements and short names are fine in kernels' launchers and tests.
ignore = ["E501", "E701", "E702", "E731", "E741", "E402"]
