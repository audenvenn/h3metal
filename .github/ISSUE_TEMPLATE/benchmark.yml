name: Benchmark from another Mac
description: Numbers from a Mac other than the M6 Mac mini the project is developed on
labels: [benchmark]
body:
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Chip, GPU cores, memory, macOS version.
      placeholder: Apple M5 Max · 40-core GPU · 128 GB · macOS 27.2
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output of `python bench/speed.py` (or of the commands you ran), and the weight formats.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
