name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install numpy ruff
      - name: Lint
        run: ruff check .
      - name: Byte-compile all Python sources
        run: python -m compileall -q h3metal tests bench tools
      - name: Conversion numerics (no GPU)
        run: python tests/test_convert.py
      - name: Repository contains English only
        run: python tools/check_english.py
